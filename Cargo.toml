[workspace]
members = [
    "windai",
    # 
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/evilArsh/windai"
authors = ["arsh <arshdebian@163.com>"]
license = "MIT OR Apache-2.0"


[workspace.dependencies]
futures = "0.3"
regex = "1.12.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
serde_json = "=1.0.149"
derive_builder = "0.20.2"
unicode-segmentation = "1.12.0"
bytes = "1"
encoding_rs = "0.8.35"
dotenvy = "0.15.7"
mime = "0.3.17"
thiserror = "2"