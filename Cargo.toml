[workspace]
members = [
    "windai",
    # 
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/evilArsh/windai"
authors = ["arsh <arshdebian@163.com>"]
license = "MIT OR Apache-2.0"


[workspace.dependencies]
futures = "0.3"
regex = "1.12"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
derive_builder = "0.20"
unicode-segmentation = "1.12"
bytes = "1"
encoding_rs = "0.8"
dotenvy = "0.15"
mime = "0.3"
thiserror = "2"
async-stream = "0.3"
rusqlite = { version = "0.39", features = ["bundled", "backup", "hooks"] }
