jsonschema = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[[bin]]
name = "mcp_test_server"
path = "tests/support/server.rs"

[[bin]]
name = "mcp_exec_helper"
path = "tests/support/exec_helper.rs"
